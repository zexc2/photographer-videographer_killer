<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="880" height="250" font-family="Helvetica, Arial, sans-serif">
  <rect width="880" height="250" rx="12" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#66726c"/>
    </marker>
  </defs>
  <g font-size="15" fill="#1c2320">
    <!-- Your computer -->
    <rect x="20" y="40" width="190" height="120" rx="10" fill="#f3f4f2" stroke="#d8ddd9"/>
    <text x="115" y="72" text-anchor="middle" font-weight="700">Your computer</text>
    <text x="115" y="100" text-anchor="middle" font-size="13" fill="#66726c">Browser</text>
    <text x="115" y="122" text-anchor="middle" font-size="13" fill="#66726c">Pick camera · set path</text>
    <text x="115" y="144" text-anchor="middle" font-size="13" fill="#66726c">Preview · download video</text>
    <!-- Server -->
    <rect x="300" y="40" width="230" height="120" rx="10" fill="#f3f4f2" stroke="#d8ddd9"/>
    <text x="415" y="72" text-anchor="middle" font-weight="700">Linux server (no GPU)</text>
    <text x="415" y="100" text-anchor="middle" font-size="13" fill="#66726c">Workbench frontend/</text>
    <text x="415" y="122" text-anchor="middle" font-size="13" fill="#66726c">Job runner atlas-run</text>
    <text x="415" y="144" text-anchor="middle" font-size="13" fill="#66726c">GPU guard gpu-up / gpu-guard</text>
    <!-- RunPod -->
    <rect x="620" y="40" width="240" height="120" rx="10" fill="#fdf0e8" stroke="#d9662b"/>
    <text x="740" y="72" text-anchor="middle" font-weight="700">RunPod GPU pod</text>
    <text x="740" y="100" text-anchor="middle" font-size="13" fill="#66726c">Recommended: A100 80GB</text>
    <text x="740" y="122" text-anchor="middle" font-size="13" fill="#66726c">4C4D training / rendering</text>
    <text x="740" y="144" text-anchor="middle" font-size="13" fill="#66726c">Auto shutdown when done</text>
    <!-- Global volume -->
    <rect x="620" y="190" width="240" height="44" rx="10" fill="#f3f4f2" stroke="#d8ddd9"/>
    <text x="740" y="217" text-anchor="middle" font-size="12">Global volume: models · envs · results</text>
  </g>
  <g stroke="#66726c" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M212 100 H296"/>
    <path d="M532 100 H616"/>
    <path d="M740 162 V186"/>
  </g>
  <g font-size="12" fill="#66726c" text-anchor="middle">
    <text x="254" y="92">SSH tunnel</text>
    <text x="574" y="92">API + SSH</text>
  </g>
</svg>
