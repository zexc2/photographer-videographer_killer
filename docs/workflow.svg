<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="880" height="250" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, sans-serif">
  <rect width="880" height="250" rx="12" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#66726c"/>
    </marker>
  </defs>
  <g font-size="15" fill="#1c2320">
    <!-- 你的电脑 -->
    <rect x="20" y="40" width="190" height="120" rx="10" fill="#f3f4f2" stroke="#d8ddd9"/>
    <text x="115" y="72" text-anchor="middle" font-weight="700">你的电脑</text>
    <text x="115" y="100" text-anchor="middle" font-size="13" fill="#66726c">浏览器</text>
    <text x="115" y="122" text-anchor="middle" font-size="13" fill="#66726c">选机位 · 设运镜</text>
    <text x="115" y="144" text-anchor="middle" font-size="13" fill="#66726c">看预览 · 下载视频</text>
    <!-- 服务器 -->
    <rect x="300" y="40" width="230" height="120" rx="10" fill="#f3f4f2" stroke="#d8ddd9"/>
    <text x="415" y="72" text-anchor="middle" font-weight="700">Linux 服务器（无 GPU）</text>
    <text x="415" y="100" text-anchor="middle" font-size="13" fill="#66726c">运镜工作台 frontend/</text>
    <text x="415" y="122" text-anchor="middle" font-size="13" fill="#66726c">任务执行器 atlas-run</text>
    <text x="415" y="144" text-anchor="middle" font-size="13" fill="#66726c">GPU 护栏 gpu-up / gpu-guard</text>
    <!-- RunPod -->
    <rect x="620" y="40" width="240" height="120" rx="10" fill="#fdf0e8" stroke="#d9662b"/>
    <text x="740" y="72" text-anchor="middle" font-weight="700">RunPod GPU pod</text>
    <text x="740" y="100" text-anchor="middle" font-size="13" fill="#66726c">推荐 A100 80GB</text>
    <text x="740" y="122" text-anchor="middle" font-size="13" fill="#66726c">4C4D 训练 / 渲染</text>
    <text x="740" y="144" text-anchor="middle" font-size="13" fill="#66726c">用完自动关机</text>
    <!-- Global volume -->
    <rect x="620" y="190" width="240" height="44" rx="10" fill="#f3f4f2" stroke="#d8ddd9"/>
    <text x="740" y="217" text-anchor="middle" font-size="13">Global volume：模型 · 环境包 · 结果</text>
  </g>
  <g stroke="#66726c" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M212 100 H296"/>
    <path d="M532 100 H616"/>
    <path d="M740 162 V186"/>
  </g>
  <g font-size="12" fill="#66726c" text-anchor="middle">
    <text x="254" y="92">SSH 隧道</text>
    <text x="574" y="92">API + SSH</text>
  </g>
</svg>
